name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finopser
          POSTGRES_USER: finopser
          POSTGRES_PASSWORD: finopser
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U finopser -d finopser"
          --health-interval 3s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: finopser
      POSTGRES_USER: finopser
      POSTGRES_PASSWORD: finopser
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install --prefer-offline --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build backend frontend
      - run: docker compose up -d --no-build --wait
      - run: curl --fail --retry 3 --retry-delay 1 http://127.0.0.1:8080/ && curl --fail --retry 3 --retry-delay 1 http://127.0.0.1:8000/api/ready/
      - if: always()
        run: docker compose down -v
