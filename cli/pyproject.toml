[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finopser-cli"
version = "0.1.0"
description = "Read-only command-line client for Finopser"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
finopser = "finopser_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
